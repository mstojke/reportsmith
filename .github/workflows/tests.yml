name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    # Pinned: setup-python has no Python 3.9 build for Ubuntu 26.04, so this
    # job would break when ubuntu-latest moves there.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with all optional dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --cov=reportsmith --cov-report=term-missing

  coverage-badge:
    # Publishes the coverage badge shown in the README: on pushes to main,
    # measure coverage and commit a shields.io endpoint JSON to the
    # "badges" branch. No third-party service or secret needed.
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with all optional dependencies
        run: python -m pip install -e ".[dev]"

      - name: Measure coverage
        run: |
          python -m pytest --cov=reportsmith --cov-report=json:coverage.json -q
          python .github/scripts/coverage_badge.py coverage.json "$RUNNER_TEMP/coverage-badge.json"

      - name: Commit badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            # Explicit refspec: actions/checkout makes a single-branch clone,
            # where a plain "fetch origin badges" only updates FETCH_HEAD.
            git fetch --depth=1 origin +refs/heads/badges:refs/remotes/origin/badges
            git worktree add -B badges "$RUNNER_TEMP/badges" origin/badges
          else
            # First run: create the branch with no history from main.
            git worktree add --detach "$RUNNER_TEMP/badges"
            git -C "$RUNNER_TEMP/badges" checkout --orphan badges
            git -C "$RUNNER_TEMP/badges" rm -rf --quiet .
          fi
          cd "$RUNNER_TEMP/badges"
          cp "$RUNNER_TEMP/coverage-badge.json" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update coverage badge"
          git push origin badges

  test-minimal:
    # reportsmith has no required dependencies: the core must import and the
    # suite must pass (skipping PDF/pandas tests) with nothing optional installed.
    name: pytest (no optional dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install core package and pytest only
        run: python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -rs

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install linters
        run: python -m pip install -e . ruff mypy

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

  latex:
    # Compile the LaTeX export of every example, so the preamble and the
    # generated markup are checked against a real TeX installation.
    name: LaTeX (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pdflatex, xelatex, lualatex]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-plain-generic texlive-fonts-recommended lmodern \
            texlive-xetex texlive-luatex

      - name: Generate LaTeX from the examples
        run: |
          python -m pip install -e ".[pdf,highlight]" pandas matplotlib
          python example.py
          python examples/toc_example.py
          python examples/data_tables_example.py
          python examples/callouts_example.py
          python examples/figures_example.py
          python examples/lists_example.py
          python examples/merge_example.py

      - name: Compile with ${{ matrix.engine }}
        run: |
          for tex in example_report.tex examples/output/*.tex; do
            echo "::group::${{ matrix.engine }} $tex"
            dir=$(dirname "$tex"); name=$(basename "$tex" .tex)
            # Two passes, so the table of contents and longtables settle.
            for pass in 1 2; do
              if ! (cd "$dir" && ${{ matrix.engine }} -interaction=nonstopmode -halt-on-error "$name.tex" > /dev/null); then
                echo "::error file=$tex::${{ matrix.engine }} failed on pass $pass"
                tail -n 60 "$dir/$name.log"
                exit 1
              fi
            done
            echo "::endgroup::"
          done
