name: Examples site

# Builds every example and publishes the outputs, with an index page, to
# GitHub Pages: https://mstojke.github.io/reportsmith/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install reportsmith and the examples' extras
        run: python -m pip install -e ".[pdf,highlight]" pandas matplotlib

      - name: Build the site
        run: python .github/scripts/build_examples_site.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
